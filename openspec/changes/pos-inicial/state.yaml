    scope: "Setup + esquema BD/migraciones (Fases 1-2)"
    status: done_verified
    verify_report: verify-report-pr1.md
    verdict: PASS (0 CRITICAL, 2 WARNING no bloqueantes, 2 SUGGESTION)
  - id: PR2
    scope: "Auth PIN + Catalogo (Fases 3-4)"
    status: done_verified
    verify_report: verify-report-pr2.md
    verdict: PASS (0 CRITICAL, 3 WARNING no bloqueantes, 4 SUGGESTION) - guard de rol confirmado real e infalsificable
    followup: "RESUELTO - boton Editar en Productos.tsx + 5 tests de guard IPC faltantes (ver apply-progress.md seccion 'PR2 follow-up')"
  - id: PR3
    scope: "Ventas + Caja (Fases 5-6)"
    status: done_verified
    verify_report: verify-report-pr3.md
    verdict: PASS tras fix - se encontro y corrigio 1 CRITICAL real (tolerancia de $0.01 en pago dividido, commit 64ceb2b)
    note: "5.10 (impresion de ticket) diferida a PR4 por dependencia de Fase 9, confirmado por verificacion"
  - id: PR4
    scope: "Creditos + Corte del Dia + Impresion (Fases 7-9)"
    status: done_verified
    verify_report: verify-report-pr4.md
    verdict: PASS (0 CRITICAL, 2 WARNING). WARNING-1 (redondeo cashOnHand) corregido en commit b425ea3.
    accepted_risk: "WARNING-2: sales:create + credit:grant no son atomicos (2 llamadas IPC separadas). Riesgo real dado que el local pierde luz seguido - si se corta la energia entre ambas llamadas, la venta queda registrada pero el saldo de credito del cliente no se actualiza. Decision EXPLICITA del usuario: diferir, no implementar ahora. Ver apply-progress.md seccion 'RIESGO ACEPTADO Y DIFERIDO' para sintomas/deteccion/remediacion si se retoma."
  - id: PR5
    scope: "Empaquetado/CI + Validacion en sitio (Fases 10-11)"
    status: apply_done_pending_verify
    note: "Fase 10 (6/6) implementada: .github/workflows/build-mac.yml + README.md + docs/validacion-sitio.md. Sintaxis YAML validada localmente con js-yaml, NO confirmado en runner real de GitHub Actions (requiere revisar la pestana Actions tras el push/tag - ver apply-progress.md seccion PR5 'Limite real de esta sesion'). Fase 11 (5 tareas) entregada como checklist accionable (docs/validacion-sitio.md) deliberadamente SIN marcar [x] en tasks.md - describe verificacion fisica en la Mac real del cliente, no ejecutable desde esta sesion. 216/216 tests sin cambio (PR5 no toca src/)."
git: local repo initialized, root commit dc5656e (docs SDD); remoto en https://github.com/randrescamacho-cmd/pescaderia (main), publico

phases:
  explore:
    status: done
    artifact: exploration.md
  proposal:
    status: done
    artifact: proposal.md
    depends_on: []
  specs:
    status: done
    artifact: specs/{catalog-management,sales-transactions,cash-register,customer-credit,daily-report,auth-roles,ticket-printing}/spec.md
    depends_on: [proposal]
  design:
    status: done
    artifact: design.md
    depends_on: [proposal]
  tasks:
    status: done
    artifact: tasks.md
    depends_on: [specs, design]
    review_workload_forecast:
      risk: high
      chained_prs_recommended: true
      decision_needed_before_apply: true
  apply:
    status: in_progress
    depends_on: [tasks]
    current_pr: PR5
    open_decisions:
      - "Boton de respaldo manual del .sqlite en panel Admin - el usuario lo esta pensando, NO implementar hasta que confirme"
  verify:
    status: pending
    depends_on: [apply]
  archive:
    status: pending
    depends_on: [verify]
